name: CI

on:
  # trigger on all commits to main
  push:
    branches:
      - main

  # trigger on pull requests to main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # trigger on request
  workflow_dispatch:

  # trigger weekly, to catch new stable releases and advisories
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7

      - name: 📦 Install pre-commit
        run: pip install pre-commit

      - name: 🔍 Run pre-commit checks on all files
        run: pre-commit run --all-files --verbose --color=always --show-diff-on-failure

      - name: 📦 Install just
        uses: extractions/setup-just@v3

      - name: 🔗 Check pinned toolchain equals rust-version
        run: just toolchain-check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v7

      - name: 📦 Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: clippy-${{ matrix.features }}

      - name: 🔎 Run clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 🔎 Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        features: ["--all-features", "--no-default-features"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: 📦 Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.features }}

      - name: 🧪 Run tests
        run: cargo test --workspace ${{ matrix.features }} --color always

  test-stable:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      matrix:
        features: ["--all-features", "--no-default-features"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: 🦀 Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: 📦 Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: test-stable-${{ matrix.features }}

      - name: 🧪 Run tests
        run: cargo test --workspace ${{ matrix.features }} --color always

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 📦 Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: docs

      - name: 📄 Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
