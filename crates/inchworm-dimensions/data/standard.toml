schema = 1

[registry]
name = "standard"
version = "1"


# ---- base dimensions (ISQ) ----

[base]
length = { symbol = "L" }
mass = { symbol = "M" }
time = { symbol = "T" }
electric_current = { symbol = "I" }
temperature = { symbol = "Θ" }
amount_of_substance = { symbol = "N" }
luminous_intensity = { symbol = "J" }

# ---- angles: named derived dimensions with dimensionless signature ----
# Auto-classified as irreducible dimensionless kinds: they are NEVER
# silently collapsed to bare dimensionless.

[dimensionless]
plane_angle = { definition = "length / length", aliases = ["angle"] }
solid_angle = { definition = "length^2 / length^2" }
# ---- named dimensionless kinds ----
strain = { definition = "length / length" }


# ---- named derived dimensions ----

[derived]
area = { definition = "length^2" }
volume = { definition = "length^3" }
velocity = { definition = "length / time" }
acceleration = { definition = "velocity / time" }
force = { definition = "mass * acceleration" }
pressure = { definition = "force / area" }
energy = { definition = "force * length" }
power = { definition = "energy / time" }
frequency = { definition = "1 / time" }
electric_charge = { definition = "electric_current * time" }
voltage = { definition = "power / electric_current" }
angular_velocity = { definition = "plane_angle / time" }
angular_acceleration = { definition = "plane_angle / time^2" }
torque = { definition = "energy / plane_angle" }
luminous_flux = { definition = "luminous_intensity * solid_angle" }
